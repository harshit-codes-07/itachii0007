<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hair Back -->
  <path d="M 40 120 C 25 150, 15 200, 25 240 L 175 240 C 185 200, 175 150, 160 120 Z" fill="#f8d6b8" />

  <!-- Chibi Dress / Kimono Collar -->
  <path d="M 55 210 L 100 230 L 145 210 L 155 240 L 45 240 Z" fill="#ffe4e6" />
  <path d="M 80 215 L 100 235 L 120 215" stroke="#f43f5e" stroke-width="3" fill="none" />

  <!-- Chibi Face Head -->
  <ellipse cx="100" cy="130" rx="65" ry="58" fill="#fff5eb" />

  <!-- Blush Cheeks -->
  <ellipse cx="62" cy="148" rx="12" ry="7" fill="#fecdd3" opacity="0.8" />
  <ellipse cx="138" cy="148" rx="12" ry="7" fill="#fecdd3" opacity="0.8" />

  <!-- Chibi Eyes (Sparkly Anime Eyes) -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="72" cy="132" rx="14" ry="18" fill="#38bdf8" />
    <ellipse cx="72" cy="132" rx="10" ry="14" fill="#0284c7" />
    <circle cx="68" cy="125" r="5" fill="#ffffff" />
    <circle cx="76" cy="138" r="2.5" fill="#ffffff" />
    <!-- Eyelash -->
    <path d="M 54 122 C 65 112, 85 114, 88 124" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="128" cy="132" rx="14" ry="18" fill="#38bdf8" />
    <ellipse cx="128" cy="132" rx="10" ry="14" fill="#0284c7" />
    <circle cx="124" cy="125" r="5" fill="#ffffff" />
    <circle cx="132" cy="138" r="2.5" fill="#ffffff" />
    <!-- Eyelash -->
    <path d="M 112 124 C 115 114, 135 112, 146 122" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Cute Little Mouth & Nose -->
  <circle cx="100" cy="142" r="1.5" fill="#d97706" />
  <path d="M 94 153 Q 100 159 106 153" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Chibi Hair Bangs (Peach/Blonde) -->
  <path d="M 38 120 C 35 70, 70 35, 100 35 C 130 35, 165 70, 162 120 C 150 100, 140 95, 130 115 C 120 90, 105 85, 100 110 C 95 85, 80 90, 70 115 C 60 95, 50 100, 38 120 Z" fill="#fed7aa" />
  <!-- Hair Strands -->
  <path d="M 100 38 Q 98 75 92 105" stroke="#fbd38d" stroke-width="2" fill="none" />
  <path d="M 118 48 Q 122 80 126 108" stroke="#fbd38d" stroke-width="2" fill="none" />

  <!-- Pink Hair Ribbons / Bows -->
  <!-- Left Bow -->
  <g transform="translate(36, 68) rotate(-15)">
    <path d="M 0 0 C -15 -18, -25 5, 0 10 C -25 15, -15 38, 0 20 Z" fill="#fb7185" />
    <circle cx="0" cy="10" r="5" fill="#f43f5e" />
  </g>
  <!-- Right Bow -->
  <g transform="translate(164, 68) rotate(15)">
    <path d="M 0 0 C 15 -18, 25 5, 0 10 C 25 15, 15 38, 0 20 Z" fill="#fb7185" />
    <circle cx="0" cy="10" r="5" fill="#f43f5e" />
  </g>
</svg>
